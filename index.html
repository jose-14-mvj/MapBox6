<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Control Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
:root{--bg:#080b0f;--surface:#0d1117;--surface2:#131923;--border:#1e2a38;--accent:#00e5ff;--red:#ff3d57;--warn:#ffb300;--ok:#00e676;--text:#c8d6e5;--dim:#4a6278;--mono:'Share Tech Mono',monospace;--main:'Barlow Condensed',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--main);height:100vh;overflow:hidden;display:grid;grid-template-rows:52px 1fr;grid-template-columns:320px 1fr}
header{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:16px;z-index:10}
.logo{font-size:18px;font-weight:900;letter-spacing:4px;text-transform:uppercase;color:var(--accent);text-shadow:0 0 20px var(--accent)}
.logo span{color:var(--dim);font-weight:300}
.hdr-right{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
.hdr-right b{color:var(--ok)}
aside{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.dev-hdr{padding:12px 16px 10px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.dev-count{background:var(--surface2);border:1px solid var(--border);padding:1px 7px;border-radius:10px;font-family:var(--mono);font-size:11px;color:var(--accent)}
#alert-banner{display:none;padding:6px 16px;background:rgba(255,61,87,.15);border-bottom:1px solid rgba(255,61,87,.4);font-family:var(--mono);font-size:11px;color:var(--red);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:.5}}
#device-list{flex:1;overflow-y:auto;padding:6px 0}
#device-list::-webkit-scrollbar{width:4px}
#device-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.dcard{margin:4px 8px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.dcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim);transition:background .2s}
.dcard.sel{border-color:var(--accent);background:rgba(0,229,255,.04)}
.dcard.sel::before{background:var(--accent)}
.dcard.st-fuera::before{background:var(--red)}
.dcard.st-ok::before{background:var(--ok)}
.dcard.st-offline::before{background:var(--dim)}
.dcard:hover{border-color:rgba(0,229,255,.5)}
.dname{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.dmeta{display:flex;gap:8px;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--dim)}
.badge{padding:2px 6px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.b-ok{background:rgba(0,230,118,.15);color:var(--ok);border:1px solid rgba(0,230,118,.3)}
.b-fuera{background:rgba(255,61,87,.15);color:var(--red);border:1px solid rgba(255,61,87,.3)}
.b-off{background:rgba(74,98,120,.15);color:var(--dim);border:1px solid var(--border)}
.b-bloq{background:rgba(255,179,0,.15);color:var(--warn);border:1px solid rgba(255,179,0,.3)}
.b-gpsoff{background:rgba(255,61,87,.2);color:var(--red);border:1px solid rgba(255,61,87,.4)}
main{display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;position:relative}
.infobar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:54px}
.chip{display:flex;flex-direction:column;gap:1px}
.clabel{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.cval{font-family:var(--mono);font-size:13px;color:var(--accent)}
.vsep{width:1px;height:32px;background:var(--border)}
#map{width:100%;height:100%}
.ctrlbar{display:flex;align-items:center;gap:10px;padding:10px 20px;background:var(--surface);border-top:1px solid var(--border);flex-wrap:wrap}
.btn{font-family:var(--main);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;border-radius:4px;border:1px solid;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-lock{background:rgba(255,61,87,.1);border-color:var(--red);color:var(--red)}
.btn-lock:not(:disabled):hover{background:rgba(255,61,87,.25);box-shadow:0 0 12px rgba(255,61,87,.4)}
.btn-unlock{background:rgba(0,230,118,.1);border-color:var(--ok);color:var(--ok)}
.btn-unlock:not(:disabled):hover{background:rgba(0,230,118,.25);box-shadow:0 0 12px rgba(0,230,118,.4)}
.btn-geo{background:rgba(0,229,255,.07);border-color:var(--accent);color:var(--accent)}
.btn-geo:not(:disabled):hover,.btn-geo.on{background:rgba(0,229,255,.2);box-shadow:0 0 14px rgba(0,229,255,.35)}
.btn-del{background:transparent;border-color:var(--border);color:var(--dim)}
.btn-del:not(:disabled):hover{border-color:var(--red);color:var(--red)}
.ctrl-right{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.geohint{font-family:var(--mono);font-size:10px;color:var(--warn);display:none;animation:blink 1.2s step-end infinite}
#notif-wrap{position:absolute;bottom:70px;right:16px;width:290px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none;z-index:1000}
.notif{padding:10px 14px;border-radius:6px;border-left:3px solid;background:var(--surface2);font-family:var(--mono);font-size:11px;pointer-events:all;animation:slideIn .2s ease;box-shadow:0 4px 20px rgba(0,0,0,.6)}
.n-warn{border-color:var(--red)}.n-ok{border-color:var(--ok)}.n-info{border-color:var(--accent)}
.ntitle{font-weight:bold;font-size:12px;margin-bottom:2px}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}}
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
.spin{width:40px;height:40px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--dim);font-family:var(--mono);font-size:12px;text-align:center}
</style>
</head>
<body>

<div id="loading">
  <div class="spin"></div>
  <div style="font-family:var(--mono);font-size:12px;color:var(--dim)">CONECTANDO CON FIREBASE...</div>
</div>

<header>
  <div class="logo">GPS<span>CONTROL</span></div>
  <div style="width:1px;height:24px;background:var(--border)"></div>
  <div style="font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase">Panel de Administración</div>
  <div class="hdr-right">FIREBASE: <b id="fb-status">CONECTANDO</b></div>
</header>

<aside>
  <div class="dev-hdr">Dispositivos <span class="dev-count" id="dev-count">0</span></div>
  <div id="alert-banner"></div>
  <div id="device-list"><div class="empty"><div style="font-size:36px;opacity:.3">📡</div>Cargando...</div></div>
</aside>

<main>
  <div class="infobar" id="infobar">
    <div style="color:var(--dim);font-family:var(--mono);font-size:11px">← Selecciona un dispositivo</div>
  </div>
  <div id="map"><div class="empty"><div style="font-size:36px;opacity:.3">🗺️</div>Selecciona un dispositivo para ver el mapa</div></div>
  <div class="ctrlbar">
    <button class="btn btn-lock"   id="btn-lock"   disabled onclick="bloquear()">🔒 Bloquear</button>
    <button class="btn btn-unlock" id="btn-unlock" disabled onclick="desbloquear()">🔓 Desbloquear</button>
    <div class="vsep"></div>
    <button class="btn btn-geo"    id="btn-geo"    disabled onclick="toggleGeo()">📍 Definir Geocerca</button>
    <button class="btn btn-del"    id="btn-delgeo" disabled onclick="borrarGeocerca()">🗑 Borrar Geocerca</button>
    <span class="geohint" id="geohint">CLIC = PUNTO &nbsp;·&nbsp; DOBLE CLIC = CERRAR POLÍGONO</span>
    <div class="ctrl-right" id="last-ts"></div>
  </div>
</main>

<div id="notif-wrap"></div>

<script>
// ══════════════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════════════
firebase.initializeApp({
  apiKey:            "AIzaSyCYb6kiLTpBzm7r8L_hVRp93SIDJeEwWR0",
  databaseURL:       "https://gpscontrol-5357a-default-rtdb.firebaseio.com",
  projectId:         "gpscontrol-5357a",
  storageBucket:     "gpscontrol-5357a.firebasestorage.app",
  messagingSenderId: "361968276149",
  appId:             "1:361968276149:android:3abedc768502e5eaa1e4fc"
});
const db = firebase.database();

// ══════════════════════════════════════════════
// MAPBOX
// ══════════════════════════════════════════════
mapboxgl.accessToken = 'pk.eyJ1Ijoiam9zZW1tdiIsImEiOiJjbW0zdTk2bzkwNGw0MnJweG1xajM0Z3hlIn0.-DNTYb4B6Locy9vReR8FNg';
let map = null, mapReady = false, marker = null;

// FIX 1: centrar el mapa solo la primera vez, no en cada actualización de ubicación
let primerCentrado = false;

function initMap() {
  if (mapReady) return;
  const cont = document.getElementById('map');
  cont.innerHTML = '';
  map = new mapboxgl.Map({ container:'map', style:'mapbox://styles/mapbox/dark-v11', center:[-68.15,-16.50], zoom:13 });
  map.on('load', () => {
    map.addSource('gc', { type:'geojson', data:emptyFC() });
    map.addLayer({ id:'gc-fill', type:'fill', source:'gc', paint:{'fill-color':'#00e5ff','fill-opacity':0.12} });
    map.addLayer({ id:'gc-line', type:'line', source:'gc', paint:{'line-color':'#00e5ff','line-width':2} });
    map.addSource('dr', { type:'geojson', data:emptyFC() });
    map.addLayer({ id:'dr-line', type:'line', source:'dr', paint:{'line-color':'#ffb300','line-width':2,'line-dasharray':[2,1]} });
    map.addLayer({ id:'dr-pts',  type:'circle', source:'dr', filter:['==','$type','Point'],
      paint:{'circle-radius':5,'circle-color':'#ffb300','circle-stroke-width':1,'circle-stroke-color':'#fff'} });
    map.on('click',    onMapClick);
    map.on('dblclick', onMapDblClick);
    mapReady = true;
    if (sel) loadDevice(sel);
  });
}
const emptyFC = () => ({ type:'FeatureCollection', features:[] });

// ══════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════
let devices = {};
let sel     = null;
let drawing = false, drawPts = [];
const OFFLINE_MS = 90000;

// FIX 2: guardar la última hora recibida por dispositivo para descartar datos viejos
const ultimasHoras = {};

// ══════════════════════════════════════════════
// LISTENERS FIREBASE
// ══════════════════════════════════════════════
function listen() {

  // FIX 2: filtrar ubicaciones desordenadas comparando horaGps
  db.ref('ubicaciones').on('value', snap => {
    const data = snap.val() || {};
    Object.entries(data).forEach(([id, loc]) => {
      const horaGps = loc.horaGps || loc.hora || 0;

      // Ignorar si Firebase nos manda un dato más viejo que el último procesado
      // Esto elimina el "salto" causado por reenvíos internos de Firebase
      if (horaGps > 0 && horaGps <= (ultimasHoras[id] || 0)) return;
      ultimasHoras[id] = horaGps;

      ensure(id);
      devices[id].ubicacion = loc;
      devices[id].ultimaVez = loc.hora || Date.now();
      devices[id].gpsActivo = true;
    });
    refresh();
  });

  // Estado geocerca (OK / FUERA)
  db.ref('estado').on('value', snap => {
    const data = snap.val() || {};
    Object.keys(devices).forEach(id => { devices[id].estado = null; });
    Object.entries(data).forEach(([id, est]) => {
      ensure(id);
      const prev = devices[id].estado;
      devices[id].estado = est;
      if (est === 'FUERA' && prev !== 'FUERA') alertaFuera(id);
    });
    refresh();
  });

  // Restricciones manuales
  db.ref('restricciones').on('value', snap => {
    const data = snap.val() || {};
    Object.keys(devices).forEach(id => { devices[id].bloqueado = false; });
    Object.entries(data).forEach(([id, val]) => {
      ensure(id);
      devices[id].bloqueado = val === true;
    });
    refresh();
  });

  // Info de dispositivos (gpsActivo, ultimaVez)
  db.ref('dispositivos').on('value', snap => {
    const data = snap.val() || {};
    Object.entries(data).forEach(([id, info]) => {
      ensure(id);
      if (info.gpsActivo !== undefined) devices[id].gpsActivo = info.gpsActivo;
      if (info.ultimaVez)               devices[id].ultimaVez = info.ultimaVez;
    });
    refresh();
  });

  // Estado conexión Firebase
  db.ref('.info/connected').on('value', snap => {
    const el = document.getElementById('fb-status');
    if (snap.val()) { el.textContent='CONECTADO';    el.style.color='var(--ok)'; }
    else            { el.textContent='DESCONECTADO'; el.style.color='var(--red)'; }
  });
}

function ensure(id) { if (!devices[id]) devices[id] = { id }; }

// ══════════════════════════════════════════════
// RENDER LISTA
// ══════════════════════════════════════════════
function refresh() {
  renderList();
  if (sel) { updateInfoBar(); updateMarker(); }
}

function renderList() {
  const list  = document.getElementById('device-list');
  const devs  = Object.values(devices);
  document.getElementById('dev-count').textContent = devs.length;

  if (!devs.length) {
    list.innerHTML = `<div class="empty"><div style="font-size:36px;opacity:.3">📡</div>Sin dispositivos registrados</div>`;
    return;
  }

  let alertas = 0;
  list.innerHTML = devs.map(d => {
    const { online, gpsOff, estado } = getStatus(d);
    if (estado === 'FUERA') alertas++;

    let cls = '';
    if (!online || gpsOff)       cls = 'st-offline';
    else if (estado === 'FUERA') cls = 'st-fuera';
    else if (estado === 'OK')    cls = 'st-ok';

    const badges = [];
    if (!online)               badges.push(`<span class="badge b-off">SIN SEÑAL</span>`);
    else if (gpsOff)           badges.push(`<span class="badge b-gpsoff">GPS OFF</span>`);
    else if (estado==='OK')    badges.push(`<span class="badge b-ok">DENTRO</span>`);
    else if (estado==='FUERA') badges.push(`<span class="badge b-fuera">FUERA</span>`);
    if (d.bloqueado)           badges.push(`<span class="badge b-bloq">BLOQUEADO</span>`);

    const ts   = d.ultimaVez ? relTime(d.ultimaVez) : 'nunca';
    const loc  = d.ubicacion || {};
    const prec = loc.precision ? `±${loc.precision.toFixed(1)}m` : '';
    const sat  = loc.satelites ? `${loc.satelites} sat` : '';

    return `<div class="dcard ${cls} ${sel===d.id?'sel':''}" onclick="selectDev('${d.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="dname">${d.id}</div>
        <div style="display:flex;gap:4px">${badges.join('')}</div>
      </div>
      <div class="dmeta">
        <span>⏱ ${ts}</span>
        ${prec?`<span>🎯 ${prec}</span>`:''}
        ${sat ?`<span>🛰 ${sat}</span>`:''}
      </div>
    </div>`;
  }).join('');

  const banner = document.getElementById('alert-banner');
  if (alertas > 0) {
    banner.style.display  = 'block';
    banner.textContent    = `⚠ ${alertas} DISPOSITIVO${alertas>1?'S':''} FUERA DE GEOCERCA`;
  } else {
    banner.style.display  = 'none';
  }
}

// ══════════════════════════════════════════════
// STATUS HELPER
// ══════════════════════════════════════════════
function getStatus(d) {
  const now    = Date.now();
  const last   = d.ultimaVez || 0;
  const online = last > 0 && (now - last) < OFFLINE_MS;
  const gpsOff = d.gpsActivo === false && last > 0 && (now - last) < 300000;
  return { online, gpsOff, estado: d.estado || null };
}

// ══════════════════════════════════════════════
// SELECCIONAR DISPOSITIVO
// ══════════════════════════════════════════════
function selectDev(id) {
  // FIX 1: al cambiar de dispositivo, permitir centrar de nuevo
  if (sel !== id) primerCentrado = false;
  sel = id;
  ['btn-lock','btn-unlock','btn-geo','btn-delgeo'].forEach(b => document.getElementById(b).disabled = false);
  initMap();
  refresh();
  if (mapReady) loadDevice(id);
}

function loadDevice(id) {
  if (!mapReady) return;
  const d = devices[id];
  if (d?.ubicacion) updateMarker();
  db.ref(`geocercas/${id}/puntos`).once('value', snap => {
    const pts = snap.val();
    if (pts) {
      const coords = (Array.isArray(pts) ? pts : Object.values(pts)).map(p => [p.lng, p.lat]);
      if (coords.length >= 3) { drawGC([...coords, coords[0]]); return; }
    }
    drawGC(null);
  });
}

// ══════════════════════════════════════════════
// INFO BAR
// ══════════════════════════════════════════════
function updateInfoBar() {
  const bar = document.getElementById('infobar');
  if (!sel) return;
  const d = devices[sel];
  if (!d) return;
  const { online, gpsOff, estado } = getStatus(d);
  const loc    = d.ubicacion || {};
  const eColor = estado==='OK' ? 'var(--ok)' : estado==='FUERA' ? 'var(--red)' : 'var(--dim)';
  const gColor = online && !gpsOff ? 'var(--ok)' : 'var(--red)';
  const gTxt   = !online ? 'SIN SEÑAL' : gpsOff ? 'GPS OFF' : 'ACTIVO';

  bar.innerHTML = `
    <div class="chip"><div class="clabel">Dispositivo</div><div class="cval">${sel}</div></div>
    <div class="vsep"></div>
    <div class="chip"><div class="clabel">Geocerca</div><div class="cval" style="color:${eColor}">${estado||'—'}</div></div>
    <div class="vsep"></div>
    <div class="chip"><div class="clabel">GPS</div><div class="cval" style="color:${gColor}">${gTxt}</div></div>
    <div class="chip"><div class="clabel">Precisión</div><div class="cval">${loc.precision?`±${loc.precision.toFixed(1)}m`:'—'}</div></div>
    <div class="chip"><div class="clabel">Satélites</div><div class="cval">${loc.satelites??'—'}</div></div>
    <div class="chip"><div class="clabel">Velocidad</div><div class="cval">${loc.velocidad?(loc.velocidad*3.6).toFixed(1)+' km/h':'—'}</div></div>
    <div class="vsep"></div>
    <div class="chip"><div class="clabel">Bloqueo</div><div class="cval" style="color:${d.bloqueado?'var(--warn)':'var(--dim)'}">${d.bloqueado?'ACTIVO':'LIBRE'}</div></div>
    <div class="vsep"></div>
    <div class="chip"><div class="clabel">Última señal</div><div class="cval" style="font-size:11px">${d.ultimaVez?relTime(d.ultimaVez):'—'}</div></div>`;
  document.getElementById('last-ts').textContent =
    loc.hora ? `Actualizado: ${new Date(loc.hora).toLocaleTimeString()}` : '';
}

// ══════════════════════════════════════════════
// MARCADOR
// FIX 1: el marcador se mueve instantáneamente (sin animación que causa saltos visuales)
// FIX 3: el mapa solo centra en la primera ubicación — el usuario puede mover el mapa libremente
// ══════════════════════════════════════════════
function updateMarker() {
  if (!mapReady || !sel) return;
  const d = devices[sel];
  if (!d?.ubicacion?.latitud) return;
  const { latitud:lat, longitud:lng } = d.ubicacion;

  if (!marker) {
    const el = document.createElement('div');
    el.style.cssText = 'width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 14px var(--accent)';
    marker = new mapboxgl.Marker({ element:el, pitchAlignment:'map' })
      .setLngLat([lng, lat])
      .addTo(map);
  } else {
    // Mover el marcador directamente sin animación — evita el efecto "baile"
    marker.setLngLat([lng, lat]);
  }

  // Centrar el mapa solo la primera vez que aparece una ubicación
  // Después el usuario puede mover el mapa libremente sin que vuelva a saltar
  if (!primerCentrado) {
    map.easeTo({ center:[lng, lat], zoom:17, duration:600 });
    primerCentrado = true;
  }
}

// ══════════════════════════════════════════════
// BLOQUEAR / DESBLOQUEAR
// ══════════════════════════════════════════════
function bloquear() {
  if (!sel) return;
  db.ref(`restricciones/${sel}`).set(true)
    .then(()  => notif('🔒 Dispositivo bloqueado', sel, 'warn'))
    .catch(e  => notif('Error al bloquear', e.message, 'warn'));
}

function desbloquear() {
  if (!sel) return;
  Promise.all([
    db.ref(`restricciones/${sel}`).set(false),
    db.ref(`estado/${sel}`).set('OK'),
    db.ref(`dispositivos/${sel}/estado`).set('OK')
  ])
  .then(() => notif('🔓 Dispositivo desbloqueado', sel, 'ok'))
  .catch(e  => notif('Error al desbloquear', e.message, 'warn'));
}

// ══════════════════════════════════════════════
// GEOCERCA — DIBUJO
// ══════════════════════════════════════════════
function toggleGeo() {
  drawing = !drawing;
  const btn  = document.getElementById('btn-geo');
  const hint = document.getElementById('geohint');
  if (drawing) {
    drawPts = [];
    btn.classList.add('on'); btn.textContent = '✅ Guardar Geocerca';
    hint.style.display = 'block';
    map.getCanvas().style.cursor = 'crosshair';
    map.getSource('dr').setData(emptyFC());
  } else {
    btn.classList.remove('on'); btn.textContent = '📍 Definir Geocerca';
    hint.style.display = 'none';
    map.getCanvas().style.cursor = '';
    if (drawPts.length >= 3) saveGC();
    else { notif('Geocerca incompleta','Necesitas ≥ 3 puntos','warn'); drawPts = []; }
    map.getSource('dr').setData(emptyFC());
  }
}

function onMapClick(e) {
  if (!drawing) return;
  drawPts.push([e.lngLat.lng, e.lngLat.lat]);
  renderDraw();
}
function onMapDblClick(e) {
  if (!drawing) return;
  e.preventDefault();
  drawPts.push([e.lngLat.lng, e.lngLat.lat]);
  toggleGeo();
}
function renderDraw() {
  const feats = drawPts.map(p => ({ type:'Feature', geometry:{ type:'Point', coordinates:p } }));
  if (drawPts.length >= 2)
    feats.push({ type:'Feature', geometry:{ type:'LineString',
      coordinates:[...drawPts, ...(drawPts.length>=3?[drawPts[0]]:[])] } });
  map.getSource('dr').setData({ type:'FeatureCollection', features:feats });
}
function saveGC() {
  if (!sel || drawPts.length < 3) return;
  const puntos = drawPts.map(p => ({ lat:p[1], lng:p[0] }));
  db.ref(`geocercas/${sel}/puntos`).set(puntos).then(() => {
    notif('✅ Geocerca guardada', `${puntos.length} puntos — ${sel}`, 'ok');
    drawGC([...drawPts, drawPts[0]]);
  });
}
function drawGC(coords) {
  if (!mapReady) return;
  map.getSource('gc').setData(coords
    ? { type:'FeatureCollection', features:[{ type:'Feature', geometry:{ type:'Polygon', coordinates:[coords] } }] }
    : emptyFC());
}
function borrarGeocerca() {
  if (!sel) return;
  if (!confirm(`¿Borrar geocerca de "${sel}"?\nEl teléfono se desbloqueará automáticamente.`)) return;
  Promise.all([
    db.ref(`geocercas/${sel}`).remove(),
    db.ref(`estado/${sel}`).set('OK'),
    db.ref(`dispositivos/${sel}/estado`).set('OK'),
    db.ref(`restricciones/${sel}`).set(false)
  ]).then(() => {
    notif('🗑 Geocerca eliminada y dispositivo desbloqueado', sel, 'ok');
    drawGC(null);
  });
}

// ══════════════════════════════════════════════
// NOTIFICACIONES
// ══════════════════════════════════════════════
const alertasEnv = {};
function alertaFuera(id) {
  const now = Date.now();
  if (alertasEnv[id] && now - alertasEnv[id] < 60000) return;
  alertasEnv[id] = now;
  notif(`⛔ FUERA DE GEOCERCA`, id, 'warn');
  if ('Notification' in window && Notification.permission === 'granted')
    new Notification('⛔ Dispositivo fuera de geocerca', { body:id });
}
function notif(titulo, cuerpo, tipo='info') {
  const wrap = document.getElementById('notif-wrap');
  const el   = document.createElement('div');
  el.className = `notif n-${tipo}`;
  el.innerHTML = `<div class="ntitle">${titulo}</div><div style="color:var(--dim)">${cuerpo}</div>`;
  wrap.prepend(el);
  setTimeout(() => el.remove(), 5000);
}

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
function relTime(ts) {
  const d = Date.now() - ts;
  if (d < 5000)    return 'ahora mismo';
  if (d < 60000)   return `${Math.floor(d/1000)}s`;
  if (d < 3600000) return `${Math.floor(d/60000)}m`;
  return `${Math.floor(d/3600000)}h`;
}

// ══════════════════════════════════════════════
// BOOT
// ══════════════════════════════════════════════
(function boot() {
  if ('Notification' in window && Notification.permission === 'default')
    Notification.requestPermission();
  listen();
  document.getElementById('loading').style.display = 'none';
  setInterval(renderList, 10000);
})();
</script>
